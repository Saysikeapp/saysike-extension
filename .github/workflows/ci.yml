name: CI

on:
  push:
    branches: [main, "release-please--**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build & zip (Chrome MV3)
        run: bun run zip
        env:
          WXT_BASE_CLIENT_URI: ${{ vars.WXT_BASE_CLIENT_URI }}
          WXT_BASE_SERVER_URI: ${{ vars.WXT_BASE_SERVER_URI }}

      - name: Build & zip (Firefox)
        if: >-
          (github.event_name == 'push' && startsWith(github.ref_name, 'release-please--')) ||
          (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--'))
        run: bun run zip:firefox
        env:
          WXT_BASE_CLIENT_URI: ${{ vars.WXT_BASE_CLIENT_URI }}
          WXT_BASE_SERVER_URI: ${{ vars.WXT_BASE_SERVER_URI }}

      - name: Dry-run submit (Chrome Web Store)
        if: >-
          (github.event_name == 'push' && startsWith(github.ref_name, 'release-please--')) ||
          (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--'))
        run: |
          VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          bunx wxt submit --dry-run \
            --chrome-zip .output/saysike-extension-${VERSION}-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Dry-run submit (Firefox Add-ons)
        if: >-
          (github.event_name == 'push' && startsWith(github.ref_name, 'release-please--')) ||
          (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--'))
        run: |
          VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          bunx wxt submit --dry-run \
            --firefox-zip .output/saysike-extension-${VERSION}-firefox.zip \
            --firefox-sources-zip .output/saysike-extension-${VERSION}-sources.zip \
            --firefox-channel listed
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
